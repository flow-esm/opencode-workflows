name: openreview

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  openreview:
    # PR-only: require this comment be on a PR.
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/openreview') &&
      (github.event.comment.author_association == 'tobifinn' ||
       github.event.comment.author_association == 'MEMBER')
    uses: flow-esm/opencode-workflows/.github/workflows/openreview.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      comment_id:   ${{ github.event.comment.id }}
      comment_body: ${{ github.event.comment.body }}
      test_globs:   ${{ vars.OPENCODE_TEST_GLOBS || '**/test_*.py,**/*_test.py,**/tests/**,**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js,**/*_test.go,**/*Test.java,**/*Spec.scala' }}
      code_globs:   ${{ vars.OPENCODE_CODE_GLOBS || '!**/test_*.py,!**/*_test.py,!**/tests/**,!**/*.test.ts,!**/*.test.js,!**/*.spec.ts,!**/*.spec.js,!**/*_test.go,!**/*Test.java,!**/*Spec.scala' }}
    secrets: inherit
