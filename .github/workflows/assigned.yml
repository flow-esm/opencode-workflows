name: assigned

on:
  workflow_call:
    inputs:
      issue_number:    { type: number,  required: true }
      ref:             { type: string,  required: false, default: '' }
      workflows_ref:   { type: string,  required: false, default: v1 }
      test_globs:      { type: string,  required: true }
      code_globs:      { type: string,  required: true }

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: assigned-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: tobifinn/opencode-workflows/.github/actions/setup@main
        with:
          ref: ${{ inputs.ref }}
          workflows_ref: ${{ inputs.workflows_ref }}
          test_globs: ${{ inputs.test_globs }}
          code_globs: ${{ inputs.code_globs }}

      - name: Create branch and draft PR
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          # base branch = repo default
          base=$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)
          branch="opendev/issue-${ISSUE}"

          # only create if not already there
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git checkout -B "$branch" "origin/$base"
            # empty commit so the branch can host a PR
            git commit --allow-empty -m "chore: open work branch for #${ISSUE}"
            git push --set-upstream origin "$branch"
          else
            git fetch origin "$branch"
            git checkout "$branch"
          fi

          # check whether a PR already exists for this branch
          pr_number=$(gh pr list --head "$branch" --state open \
            --json number -q '.[0].number' || true)
          if [ -z "$pr_number" ]; then
            issue_title=$(gh issue view "$ISSUE" --json title -q .title)
            pr_number=$(gh pr create \
              --draft \
              --base "$base" \
              --head "$branch" \
              --title "WIP: $issue_title (closes #${ISSUE})" \
              --body "Draft PR opened by opencode-agent for issue #${ISSUE}. Specs will be posted as a comment shortly." \
              | sed -n 's#.*/pull/\([0-9]\+\).*#\1#p')
          fi

          # link from issue
          gh issue comment "$ISSUE" --body "Opened draft PR #${pr_number} on branch \`${branch}\`. Specs are being prepared there. Once specs converge, comment \`/opendev\` on the PR to start implementation."

          echo "branch=$branch"      >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Run specs-creator on the PR
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4-pro
          agent: orchestrator-openspecs
          prompt: |
            Assigned-flow specs creation for issue #${{ inputs.issue_number }},
            draft PR #${{ steps.prep.outputs.pr_number }},
            branch ${{ steps.prep.outputs.branch }}.

            Invoke @specs-creator. Behavior is identical to /openspecs except:
              - Read the original ISSUE body and thread (not the PR).
              - Post the specs (and any clarifying questions) as comments on
                PR #${{ steps.prep.outputs.pr_number }}, NOT on the issue.
              - Use the same state-marker convention:
                <!-- opencode-state workflow=openspecs phase=awaiting-user-answer ... -->
                <!-- opencode-state workflow=openspecs phase=converged ... -->
              - Tell the user (in your final comment) that they can run /opendev
                on this PR once they're satisfied with the specs.

            Follow the specs-template skill (skill/specs-template/SKILL.md).
            Do NOT modify any files.
